<main class="container py-5 password-page">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <section class="card password-card">
        <div class="card-body p-4">
          <h1 class="h3 text-center mb-4">Change Password</h1>

          @if(successMessage) {
            <p class="alert alert-success" role="status">
              {{ successMessage }}
            </p>
          }

          @if(errorMessage) {
            <p class="alert alert-danger">
              {{ errorMessage }}
            </p>
          }

          <form #changePasswordForm="ngForm" (ngSubmit)="changePassword()">

            <!-- Current Password -->
            <div class="mb-3">
              <label for="currentPassword" class="form-label">
                Current Password
              </label>

              <input
                id="currentPassword"
                name="currentPassword"
                type="password"
                class="form-control"
                [(ngModel)]="currentPassword"
                #currentPasswordModel="ngModel"
                required>

              <div
                *ngIf="currentPasswordModel.invalid && currentPasswordModel.touched"
                class="text-danger">
                Current password is required.
              </div>
            </div>

            <!-- New Password -->
            <div class="mb-3">
              <label for="newPassword" class="form-label">
                New Password
              </label>

              <input
                id="newPassword"
                name="newPassword"
                type="password"
                class="form-control"
                [(ngModel)]="newPassword"
                #newPasswordModel="ngModel"
                minlength="8"
                required>

              <div
                *ngIf="newPasswordModel.errors?.['required'] && newPasswordModel.touched"
                class="text-danger">
                New password is required.
              </div>

              <div
                *ngIf="newPasswordModel.errors?.['minlength'] && newPasswordModel.touched"
                class="text-danger">
                Password must be at least 8 characters.
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
              <label for="confirmNewPassword" class="form-label">
                Confirm New Password
              </label>

              <input
                id="confirmNewPassword"
                name="confirmNewPassword"
                type="password"
                class="form-control"
                [(ngModel)]="confirmNewPassword"
                #confirmPasswordModel="ngModel"
                required>

              <div
                *ngIf="confirmPasswordModel.invalid && confirmPasswordModel.touched"
                class="text-danger">
                Confirm password is required.
              </div>

              <div
                *ngIf="confirmPasswordModel.touched && newPassword !== confirmNewPassword"
                class="text-danger">
                Passwords do not match.
              </div>
            </div>

            <button
              class="btn btn-primary w-100"
              type="submit"
              [disabled]="changePasswordForm.invalid || newPassword !== confirmNewPassword">
              Change Password
            </button>

          </form>
        </div>
      </section>
    </div>
  </div>
</main>
