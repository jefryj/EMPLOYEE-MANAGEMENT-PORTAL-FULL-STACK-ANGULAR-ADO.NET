<main class="container login-page py-5">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card login-card shadow">
        <div class="card-body">

          <p class="login-eyebrow text-center mb-2">WELCOME BACK</p>
          <h1 class="h3 text-center mb-4">
            Employee Admin Portal
          </h1>

          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input
              id="loginEmail"
              type="email"
              class="form-control"
              [(ngModel)]="email">
          </div>

          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input
              id="loginPassword"
              type="password"
              class="form-control"
              [(ngModel)]="password">
          </div>

          <button
            class="btn btn-primary login-submit w-100"
            (click)="login()">
            Login
          </button>

        </div>
      </div>

    </div>
  </div>
</main>
