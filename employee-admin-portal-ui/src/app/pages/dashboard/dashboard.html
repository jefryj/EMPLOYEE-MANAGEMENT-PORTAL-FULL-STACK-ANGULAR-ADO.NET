<main class="container py-4 dashboard-page">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Dashboard</h1>
    <button class="btn btn-outline-primary" type="button" (click)="loadDashboard()">Refresh</button>
  </div>

  @if(errorMessage) {
    <p class="alert alert-danger">{{ errorMessage }}</p>
  }

  <section class="dashboard-totals">
    <article class="total-item">
      <h2>Employees</h2>
      <p>{{ totalEmployees ?? 'Loading...' }}</p>
    </article>
    <article class="total-item">
      <h2>Departments</h2>
      <p>{{ totalDepartments ?? 'Loading...' }}</p>
    </article>
    <article class="total-item">
      <h2>Projects</h2>
      <p>{{ totalProjects ?? 'Loading...' }}</p>
    </article>
    <article class="total-item">
      <h2>Audit logs</h2>
      <p>{{ totalAuditLogs ?? 'Loading...' }}</p>
    </article>
  </section>
</main>
