<main class="container py-4 update-employee-page">

  <header class="update-heading">
    <p class="page-kicker">EMPLOYEE RECORD</p>
    <h1>Update Employee</h1>
  </header>

  <section class="edit-employee-form">

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="employee.name">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="employee.email">
    </div>

    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="employee.phone">
    </div>

    <div class="mb-3">
      <label class="form-label">Salary</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="employee.salary">
    </div>

    <div class="mb-3">
      <label class="form-label">Department</label>
      <select
        class="form-select"
        [(ngModel)]="employee.departmentId"
        name="departmentId">

        @for(department of departments; track department.id){
          <option [ngValue]="department.id">
            {{ department.departmentName }}
          </option>
        }

      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Project</label>
      <select
        class="form-select"
        [(ngModel)]="employee.projectId"
        name="projectId">

        <option [ngValue]="undefined">
          No Project
        </option>

        @for(project of projects; track project.id){
          <option [ngValue]="project.id">
            {{ project.projectName }}
          </option>
        }

      </select>
    </div>

    <button
      class="btn btn-primary"
      (click)="updateEmployee()">
      Update Employee
    </button>

  </section>

</main>
