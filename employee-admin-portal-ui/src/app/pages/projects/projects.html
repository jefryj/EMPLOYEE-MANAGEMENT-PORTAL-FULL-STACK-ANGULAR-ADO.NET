<main class="container py-4 catalog-page project-page">
  <h1>Projects</h1>

  @if(roleId === 1) {
    <form class="project-form" (ngSubmit)="saveProject()">
      <label for="projectName" class="form-label">Project name</label>
      <div class="d-flex flex-column flex-sm-row align-items-sm-end gap-2">
        <input
          id="projectName"
          name="projectName"
          class="form-control"
          [(ngModel)]="projectName"
          required>
        <button class="btn btn-primary" type="submit">
          {{ editingId === null ? 'Add' : 'Save' }}
        </button>
        @if(editingId !== null) {
          <button class="btn btn-outline-secondary" type="button" (click)="cancelEdit()">
            Cancel
          </button>
        }
      </div>
    </form>
  }

  @if(errorMessage) {
    <p class="alert alert-danger">{{ errorMessage }}</p>
  }

  <div class="table-responsive catalog-table-shell">
  <table class="table table-striped table-hover align-middle mb-0">
    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Project</th>
        @if(roleId === 1) {
          <th scope="col">Actions</th>
        }
      </tr>
    </thead>
    <tbody>
      @for(project of projects; track project.id) {
        <tr>
          <td>{{ project.id }}</td>
          <td>{{ project.projectName }}</td>
          @if(roleId === 1) {
            <td>
              <button class="btn btn-warning btn-sm" type="button" (click)="editProject(project)">
                Update
              </button>
              <button class="btn btn-danger btn-sm ms-2" type="button" (click)="deleteProject(project.id)">
                Delete
              </button>
            </td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="roleId === 1 ? 3 : 2">No projects found.</td>
        </tr>
      }
    </tbody>
  </table>
  </div>
</main>
